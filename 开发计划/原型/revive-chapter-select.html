<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>线条突围 · 复活与选关流程设计</title>
<style>
:root{color-scheme:light;--ink:#22211e;--paper:#f4eee4;--muted:#746e65;--accent:#ac342c}*{box-sizing:border-box}body{margin:0;background:#e5dfd5;color:var(--ink);font:16px/1.5 "Microsoft YaHei",sans-serif}button,select{font:inherit}button{min-height:44px;padding:9px 20px;border:2px solid var(--ink);border-radius:12px;background:#fffdf8;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #2222}button:hover:not(:disabled){background:#eee6d8}button:focus-visible,select:focus-visible{outline:3px solid #ac342c;outline-offset:4px}button:disabled{opacity:.5;cursor:default;box-shadow:none}.primary{border:5px double var(--ink);font-weight:700;padding:11px 22px}.demo{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.demo strong{font-size:18px}.badge{font-size:12px;letter-spacing:1px;color:var(--accent);border:1px solid;padding:3px 7px;margin-right:8px}select{min-height:44px;padding:4px 12px;border:1px solid #aaa;background:#faf7f1;border-radius:8px}.frame{position:relative;max-width:1160px;min-height:540px;aspect-ratio:2.04;margin:0 auto;background:var(--paper);border:2px solid var(--ink);border-radius:15px;overflow:hidden}.screen{position:absolute;inset:0;padding:28px 5%;display:flex;flex-direction:column;justify-content:center}.home{background:linear-gradient(90deg,#f4eee4e6,#f4eee400 65%),url('../../源码/assets/landart/title-cover.jpg') center/cover}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted)}h1{font-size:clamp(38px,6vw,70px);line-height:1.15;letter-spacing:8px;margin:14px 0}h2{font-size:30px;line-height:1.25;margin:10px 0 12px}h3{margin:5px 0;font-size:24px}.home-menu{width:300px;display:grid;gap:12px}.home-menu .row{display:flex;gap:10px}.home-menu .row>*{flex:1}.home p{margin:5px 0 24px}.small{color:var(--muted);font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:2px solid var(--ink);border-radius:16px;background:#fff9;padding:23px;display:flex;flex-direction:column;gap:12px}.card button{margin-top:auto}.chapter-number{font-size:38px;line-height:1;color:var(--accent);font-weight:700}.tag{font-size:13px;color:var(--muted)}.card p{margin:0}.center{text-align:center}.panel{width:min(540px,95%);margin:auto;padding:22px 30px;border:3px solid var(--ink);border-radius:16px;background:#fffcf6;box-shadow:6px 7px 0 #2221}.panel .primary{width:100%;margin:10px 0}.actions{display:flex;gap:10px;margin:10px 0}.actions button{flex:1}.invite{margin-top:5px;border-color:#777;font-size:15px}.note{margin:10px 0 0;color:var(--muted);font-size:13px}.arena{background:linear-gradient(160deg,#efe8da,#e2ddd2)}.arena.sea{background:linear-gradient(160deg,#d8e9ec,#c8dde3)}.stats{display:flex;flex-wrap:wrap;gap:8px 24px;border-block:1px solid #aaa8;padding:12px 0;font-size:16px}.scene-title{font-size:45px;letter-spacing:3px;margin:24px 0 8px}.practice-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:25px}.info{border-left:3px solid var(--accent);padding:10px 15px;background:#fff7;text-align:left;margin:16px auto;max-width:580px}.modal{position:absolute;inset:0;background:#2229;display:grid;place-items:center;padding:20px;z-index:10}.modal .panel{max-width:520px}.foot{max-width:1160px;padding:12px 20px;margin:auto;color:#666057;font-size:13px}.foot a{color:#34302c}.status{min-height:24px;color:var(--accent);font-size:14px}.hearts{letter-spacing:3px}.count{font-size:48px}.top h2{margin:0}.home .small{max-width:300px}.empty{color:var(--muted)}
@media(max-width:900px){.frame{min-height:390px;border-radius:0;aspect-ratio:auto}.screen{padding:18px 5%}h1{font-size:42px;margin:8px 0}.home p{margin:4px 0 12px}.home-menu{width:270px;gap:8px}.home-menu .row{gap:8px}.cards{gap:12px}.card{padding:15px;gap:9px}h2{font-size:25px}.scene-title{font-size:32px;margin-top:13px}.top{margin-bottom:12px}.panel{padding:14px 22px}.panel h2{margin:5px 0}.panel p{margin:8px 0}.demo{padding:8px 15px}.foot{padding:8px 15px}.practice-controls{margin-top:14px}.info{margin:10px auto}}@media(max-width:520px){.cards{grid-template-columns:1fr}.frame{min-height:650px}.home-menu{width:min(300px,90%)}.home{background-position:60% center}.home h1{text-shadow:0 1px 0 #fff}.actions{flex-wrap:wrap}.top h2{font-size:22px}.stats{font-size:14px}.panel{width:100%;padding:18px}.scene-title{font-size:28px}.screen{padding:20px}}
.death-panel p{margin:6px 0}.death-panel .actions button{padding:8px 12px}.death-panel .actions{margin:10px 0}.death-panel .primary{margin:8px 0}.death-panel h2{margin:7px 0}
</style>
</head>
<body>
<header class="demo"><strong><span class="badge">设计演示</span>复活与选关</strong><label>演示进度 <select id="profile"><option value="0">尚未通关</option><option value="1">已通第一关</option><option value="2">两关已通</option></select></label></header>
<main class="frame" id="frame" aria-live="polite"></main>
<footer class="foot">首版建议：复活机会独立提供，邀请自愿。本页是流程稿，微信面板、战斗和成绩均为模拟，不发送消息、不修改游戏存档。 <a href="../功能/REVIVE-CHAPTER-SELECT-PLAN.md">完整设计说明</a></footer>
<script>
let screen='home',cleared=0,chapter=1,revives=0,assisted=false,best={},message='',bossHp=62,ammo=3,generation=0,shareOrigin='home';
const frame=document.querySelector('#frame'),names={1:'废弃前哨站',2:'深海突围'};
const btn=(action,label,cls='',disabled=false)=>`<button data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
const snapshot=()=>({screen,cleared,chapter,revives,assisted,best:{...best},bossHp,ammo});
Object.defineProperty(window,'__REVIVE_DESIGN__',{get:()=>snapshot()});
function home(){generation++;screen='home';message='';render()}
function start(c){if(c!==1&&c!==2||c===2&&cleared<1)return;generation++;chapter=c;revives=0;assisted=false;bossHp=62;ammo=3;screen='play';message='';render()}
function render(){
 if(screen==='home')frame.innerHTML=`<section class="screen home"><div class="eyebrow">01 · STICKMAN BREAKOUT</div><h1>线条<br>突围</h1><p>冲出重围。</p><div class="home-menu">${btn(cleared?'select':'start1',cleared?'选择关卡 →':'开始突围 →','primary')}<div class="row">${btn('share','分享游戏')}${btn('records','个人纪录')}</div></div><p class="small">${cleared?'已保存本机进度 · 可选择已解锁关卡':'通关第一关后，首页开放选择关卡。'}</p><div class="status">${message}</div></section>`;
 if(screen==='select')frame.innerHTML=`<section class="screen"><div class="top"><div><div class="eyebrow">CHAPTER SELECT</div><h2>选择关卡</h2></div>${btn('home','返回')}</div><div class="cards">${[1,2].map(c=>{const unlocked=c===1||cleared>=1,done=cleared>=c;return `<article class="card"><span class="chapter-number">0${c}</span><h3>${names[c]}</h3><span class="tag">${done?'已通关':unlocked?'已解锁':'尚未解锁'}</span><p>${best[c]?`最快 ${best[c]} 秒`:'暂无竞速纪录'}</p><p class="small">${c===1?'地面交战 · 直面机甲':'水下突围 · 挑战潜艇'}</p>${btn('start'+c,unlocked?(done?'重玩本关':'开始挑战'):'先通关第一关','primary',!unlocked)}</article>`}).join('')}</div><p class="note center">每关从起点开始 · 满血和标准装备 · 每次挑战可原地复活一次</p></section>`;
 if(screen==='play')frame.innerHTML=`<section class="screen arena ${chapter===2?'sea':''}"><div class="top"><div class="eyebrow">战斗流程示意 / 第 ${chapter} 关</div>${btn('home','返回首页')}</div><div class="stats"><span class="hearts">生命 ♥♥♥♥♥</span><span>火箭 / 鱼雷 ${ammo} 发</span><span>复活 ${revives} / 1</span><span>Boss 剩余 ${bossHp}%</span></div><div class="center"><div class="scene-title">${names[chapter]}</div><p>这里演示状态流转，不运行真实战斗。</p>${assisted?'<div class="info">已原地恢复，战场与弹药保留。正式游戏恢复操作时有 3 秒保护；本局通关计入进度，不刷新最快纪录。</div>':'<p class="small">正常通关可更新最快纪录。失败后可选择一次原地复活。</p>'}<div class="practice-controls">${btn('die','演示：玩家倒下')}${btn('win','演示：完成本关','primary')}</div></div></section>`;
 if(screen==='dead')frame.innerHTML=`<section class="screen"><div class="panel death-panel center"><div class="eyebrow">第 ${chapter} 关 · ${names[chapter]}</div><h2>突围失败</h2><p class="small">Boss 剩余 ${bossHp}% · 保留武器与 ${ammo} 发弹药</p>${revives?btn('restart','重玩本关 →','primary'):btn('revive','原地复活 · 剩余 1 次','primary')}<p class="note">${revives?'本次挑战的复活机会已使用':'满血继续 · 本局不计最快纪录'}</p><div class="actions">${!revives?btn('restart','重玩本关'):btn('select','选择关卡')}${btn('home','返回首页')}${btn('share','邀请朋友')}</div><p class="note">邀请自愿，不影响复活机会。</p>${message?`<div class="status">${message}</div>`:''}</div></section>`;
 if(screen==='ready')frame.innerHTML=`<section class="screen center"><div class="panel"><div class="eyebrow">原地恢复</div><h2>准备继续</h2><p>满血恢复，保留战场进度。</p><p class="small">恢复操作后有 3 秒保护</p></div></section>`;
 if(screen==='result')frame.innerHTML=`<section class="screen"><div class="panel center"><div class="eyebrow">MISSION COMPLETE / 0${chapter}</div><h2>突围成功</h2><p>${names[chapter]}</p><p>本局用时 97.2 秒</p><div class="info">${assisted?'使用复活，不计最快纪录。<br>通关进度已保存，可选择已解锁关卡。':'无复活通关，本局具备竞速资格。<br>个人最快纪录保留较短用时。'}<br><span class="small">本页成绩为演示值，不进入游戏存档。</span></div>${btn(chapter===1?'start2':'select',chapter===1?'进入第二关 →':'选择关卡 →','primary')}<div class="actions">${btn('restart','重玩本关')}${btn('home','返回首页')}</div></div></section>`;
 if(screen==='records')frame.innerHTML=`<section class="screen"><div class="panel center"><h2>个人纪录</h2><p>已通 ${cleared} 关</p><p>第一关最快 ${best[1]?best[1]+' 秒':'暂无纪录'}</p><p>第二关最快 ${best[2]?best[2]+' 秒':'暂无纪录'}</p><p class="small">复活局保留通关进度，不覆盖此前的最快成绩。</p>${btn('home','返回首页','primary')}</div></section>`;
}
frame.addEventListener('click',e=>{
 const action=e.target.closest('button')?.dataset.action;if(!action)return;
 if(action==='home')return home();
 if(action==='select'){generation++;screen='select';message='';return render()}
 if(action==='start1'||action==='start2')return start(Number(action.slice(-1)));
 if(action==='restart')return start(chapter);
 if(action==='records'){screen='records';return render()}
 if(action==='die'&&screen==='play'){screen='dead';message='';return render()}
 if(action==='win'&&screen==='play'){cleared=Math.max(cleared,chapter);if(!assisted)best[chapter]=Math.min(best[chapter]??Infinity,97.2);document.querySelector('#profile').value=String(cleared);screen='result';return render()}
 if(action==='revive'&&screen==='dead'&&revives===0){revives=1;assisted=true;screen='ready';const token=++generation;render();setTimeout(()=>{if(token!==generation||screen!=='ready')return;screen='play';render()},1000);return}
 if(action==='share'&&(screen==='dead'||screen==='home')){shareOrigin=screen;const modal=document.createElement('div');modal.className='modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','微信分享面板示意');modal.innerHTML=`<div class="panel center"><span class="badge">仅模拟</span><h2>微信选择收件人</h2><p>线条突围 · 一起来挑战！</p><p class="small">正式游戏直接调起微信原生面板。<br>普通分享不提供发送成功回调。</p><div class="actions">${btn('share-send','模拟发送')}${btn('share-cancel','模拟取消')}</div><p class="note">两种操作均返回原页面，不增减复活机会。</p></div>`;frame.firstElementChild.inert=true;frame.append(modal);modal.querySelector('button').focus();return}
 if(action==='share-send'||action==='share-cancel'){screen=shareOrigin;message=screen==='dead'?'已回到失败页，可自行选择是否复活。':'已返回游戏。';render()}
});
document.querySelector('#profile').addEventListener('change',e=>{cleared=Number(e.target.value);best={};if(cleared>=1)best[1]=88.6;if(cleared>=2)best[2]=92.4;revives=0;assisted=false;home()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&frame.querySelector('.modal')){screen=shareOrigin;message='已返回，复活机会保留。';render()}});
render();
</script>
</body>
</html>
