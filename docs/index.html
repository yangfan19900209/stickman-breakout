<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>线条突围 · Stickman Breakout</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
  <style>html,body{background:#faf9f5;margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:none}canvas{outline:none;touch-action:none}#safe-area-probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}</style>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>
  </div>
  <div id="safe-area-probe"></div>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

  <!-- Browser shell only: gameplay, input and UI all run through Cocos. -->
  <script>
    document.getElementById('GameCanvas').focus({preventScroll:true});
    // Browser safe-area bridge; Creator/WeChat use their own official safe-area API.
    globalThis.__BREAKOUT_SAFE_AREA__=()=>{const s=getComputedStyle(document.getElementById('safe-area-probe'));return{left:parseFloat(s.paddingLeft)||0,right:parseFloat(s.paddingRight)||0,top:parseFloat(s.paddingTop)||0,bottom:parseFloat(s.paddingBottom)||0};};
  </script>
</body>
</html>
